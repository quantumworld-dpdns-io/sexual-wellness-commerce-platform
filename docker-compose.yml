version: "3.9"

name: sexual-wellness-platform

networks:
  platform-net:
    driver: bridge

volumes:
  vault-data:
  postgres-data:

services:
  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_ADDR: http://0.0.0.0:8200
    command: >
      vault server
      -dev
      -dev-listen-address=0.0.0.0:8200
      -dev-root-token-id=root
      -log-level=info
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - platform-net

  vault-init:
    image: hashicorp/vault:1.16
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    volumes:
      - ./infra/vault/scripts:/vault/scripts:ro
      - ./infra/vault/policies:/vault/config/policies:ro
    command: ["/vault/scripts/init-dev-vault.sh"]
    restart: "no"
    networks:
      - platform-net

  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_DB: wellness
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: wellness_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/commerce/supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness -d wellness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - platform-net

  gateway:
    build:
      context: ./src/backend/gateway
      dockerfile: Dockerfile
    container_name: backend-gateway
    environment:
      PORT: "3000"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      DATABASE_URL: postgres://wellness:wellness_dev_password@postgres:5432/wellness?sslmode=disable
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform-net

  research:
    build:
      context: ./src/backend/research
      dockerfile: Dockerfile
    container_name: backend-research
    environment:
      PORT: "8000"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform-net

  quantum:
    build:
      context: ./src/backend/quantum
      dockerfile: Dockerfile
    container_name: backend-quantum
    environment:
      PORT: "8001"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform-net

  safety:
    build:
      context: ./src/backend/safety
      dockerfile: Dockerfile
    container_name: backend-safety
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[t]ail -f /dev/null'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform-net

  zkp-verifier:
    build:
      context: ./src/security/zkp-verifier
      dockerfile: Dockerfile
    container_name: security-zkp-verifier
    environment:
      PORT: "8100"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform-net

  policy-engine:
    build:
      context: ./src/security/policy-engine
      dockerfile: Dockerfile
    container_name: security-policy-engine
    environment:
      PORT: "8101"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform-net
